name: Deploy KnightMarketplace with PM2

on:
  push:
    branches:
      - main-server-sync

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knightmarketplace-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/mern

            git fetch origin
            git checkout main-server-sync
            git reset --hard origin/main-server-sync

            cd /home/mern/server
            npm ci --omit=dev

            cd /home/mern/client
            npm ci
            npm run build

            pm2 reload knightmarket-api
            pm2 save